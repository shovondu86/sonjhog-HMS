  # ── Appointments ─────────────────────────────────────────────────────────
  /appointments:
    post:
      tags: [Appointments]
      summary: Create Appointment
      operationId: create_appointment_appointments_post
      description: |
        CHANGED in 1.1.0 and 1.2.0. The server, in one transaction:

        1. Rejects a date before today (Asia/Dhaka) — `PAST_DATE`.
        2. Rejects a hospital holiday with `opd_closed` — `HOLIDAY`
           (NEW in 1.2.0).
        3. Resolves the session: `schedule_id` if given, otherwise the
           doctor's only session that day. No session (no schedule row,
           leave, cancelled) — `NO_SESSION`. More than one session and no
           `schedule_id` — `SESSION_REQUIRED`.
        4. Rejects a second non-cancelled appointment for the same patient,
           doctor and date — `DUPLICATE_BOOKING`.
        5. Picks the queue (NEW in 1.2.0): `report_showing` visits go to the
           session's report queue when `report_capacity > 0`; everything
           else, and report visits when `report_capacity` is 0, go to the
           regular queue.
        6. Assigns the lowest free `serial_number` in that queue, or
           `SESSION_FULL` when the queue is full.
        7. Derives `appointment_time`: for the regular queue,
           `start_time + (serial_number - 1) * slot_minutes` when the session
           has `slot_minutes`, otherwise the session's `start_time`. Report
           queue appointments get the session's `start_time`. A
           client-supplied `appointment_time` is ignored.

        Enforced by unique indexes, not only by application checks, so two
        concurrent requests cannot take the same serial. All are partial,
        `WHERE status <> 'cancelled'`, so a cancelled appointment frees its
        serial: `(schedule_id, appointment_date, queue, serial_number)`,
        `(exception_id, queue, serial_number)`, and
        `(patient_id, doctor_id, appointment_date)`.

        The serial given is the LOWEST free one in the session, so a
        cancellation's serial is reused before a new one is opened.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AppointmentCreate' }
      responses:
        '201':
          description: Created (or the original result of a repeated Idempotency-Key)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppointmentDetailOut' }
        '404':
          description: '`PATIENT_NOT_FOUND` or `DOCTOR_NOT_FOUND`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: |
            `PAST_DATE`, `HOLIDAY`, `NO_SESSION`, `SESSION_REQUIRED`,
            `SESSION_FULL`, `DUPLICATE_BOOKING`, `DOCTOR_NOT_ACCEPTING`, or
            `IDEMPOTENCY_KEY_REUSED`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                full:
                  value:
                    code: SESSION_FULL
                    detail: All 30 serials for 2026-09-27 are booked.
                    next_available_date: '2026-09-29'
                noSession:
                  value:
                    code: NO_SESSION
                    detail: The doctor has no OPD session on 2026-10-02.
                    next_available_date: '2026-10-03'
                holiday:
                  value:
                    code: HOLIDAY
                    detail: OPD is closed on 2026-09-30 (Durga Puja).
                    holiday_name: Durga Puja
                    next_available_date: '2026-10-01'
        '422': { $ref: '#/components/responses/ValidationError' }
    get:
      tags: [Appointments]
      summary: List Appointments
      operationId: list_appointments_appointments_get
      description: |
        CHANGED in 1.1.0: new filters `date_from`, `date_to`, `schedule_id`.
        CHANGED in 1.2.0: new filter `visit_type`.
      parameters:
        - $ref: '#/components/parameters/Skip'
        - $ref: '#/components/parameters/Limit'
        - name: patient_id
          in: query
          required: false
          schema: { type: [integer, 'null'] }
        - name: doctor_id
          in: query
          required: false
          schema: { type: [integer, 'null'] }
        - name: schedule_id
          in: query
          required: false
          schema: { type: [integer, 'null'] }
          description: NEW in 1.1.0.
        - name: status_filter
          in: query
          required: false
          schema:
            anyOf:
              - $ref: '#/components/schemas/AppointmentStatus'
              - type: 'null'
        - name: date_from
          in: query
          required: false
          schema: { type: [string, 'null'], format: date }
          description: NEW in 1.1.0. Inclusive.
        - name: date_to
          in: query
          required: false
          schema: { type: [string, 'null'], format: date }
          description: NEW in 1.1.0. Inclusive.
        - name: visit_type
          in: query
          required: false
          schema:
            anyOf:
              - $ref: '#/components/schemas/VisitType'
              - type: 'null'
          description: NEW in 1.2.0.
      responses:
        '200':
          description: Successful Response, ordered by `appointment_date`, then `queue`, then `serial_number`.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AppointmentDetailOut' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /appointments/{appointment_id}:
    parameters:
