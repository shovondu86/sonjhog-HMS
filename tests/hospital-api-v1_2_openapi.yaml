  # ── Schedule import (NEW in 1.2.0) ───────────────────────────────────────
  /schedules/import:
    post:
      tags: [Imports]
      summary: Import OPD Schedule
      operationId: import_schedules
      description: |
        Requires `admin` scope. Upload the OPD room-allocation spreadsheet
        (`.xls`, `.xlsx`) or the CSV format below, and replace the weekly
        schedule of every doctor in the file.

        ALWAYS call with `mode=preview` first. Preview parses and validates
        and changes nothing. `mode=apply` repeats the same work and commits
        it, and is refused with `409 IMPORT_HAS_ERRORS` if any problem has
        severity `error`.

        **Spreadsheet rules** (the hospital's existing layout):
        - Merged day cells mean the same hours on every day they span. A
          value merged across Saturday..Thursday is SIX sessions, not one.
        - `x`, `X`, `-` in a day cell means no session that day. An EMPTY
          day cell is an error (`BLANK_HOURS`) — the sheet does not say.
        - `09:00 am To 12:00 pm & 03:00 pm To 08:00 pm` is TWO sessions.
        - Section headers `OPD - (3rd Floor) Desk - A` set floor and desk
          for the rows below them.
        - Mobile numbers in the name cell are discarded, never stored.
        - Rows naming a room but no doctor (PFT Room, EEG Room) are
          reported as `FACILITY_ROW` warnings and not imported as schedules.

        **CSV columns**: `doctor_id` (or `doctor_name`), `weekday`,
        `start_time`, `end_time` (24-hour `HH:MM`), `room`, `floor`, `desk`,
        `max_patients`, optional `slot_minutes`, `report_capacity`.

        **What apply does**, per doctor in the file: every current schedule
        row is end-dated (`valid_to = valid_from - 1`) and the file's
        sessions are created with `valid_from`. Doctors NOT in the file are
        untouched and listed as `NOT_IN_FILE` warnings. One transaction: all
        or nothing. Written to the audit log as one `import` entry per
        doctor.
      parameters:
        - name: mode
          in: query
          required: true
          schema: { type: string, enum: [preview, apply] }
        - name: valid_from
          in: query
          required: false
          schema: { type: string, format: date }
          description: |
            First date the new schedule applies. Defaults to today. Must not
            be in the past. Use a future date to load a new rota ahead of
            time.
        - name: default_max_patients
          in: query
          required: false
          schema: { type: integer, minimum: 1 }
          description: |
            Capacity for sessions the file gives none for (the spreadsheet
            has no capacity column). Order of precedence: the file's value,
            then the doctor's current capacity for that weekday, then this.
            None of the three is a `MISSING_CAPACITY` error.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: .xls, .xlsx or .csv, at most 5 MB.
      responses:
        '200':
          description: Preview or applied result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScheduleImportResult' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: '`IMPORT_HAS_ERRORS` (apply only) — the body is the full `ScheduleImportResult`-shaped problem list under `candidates`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '415':
          description: '`UNSUPPORTED_FILE`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

