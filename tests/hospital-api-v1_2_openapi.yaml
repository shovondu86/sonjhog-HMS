openapi: 3.1.0
info:
  title: Hospital Management API
  version: 1.2.0
  description: |
    Patients, doctors, departments, OPD schedules, appointments, and the
    hospital information the call centre's voice agent reads to callers.

    This API is the SINGLE SOURCE for everything the voice agent says.
    Structured data (schedules, availability, prices, hours, rooms) is read
    live at the moment a caller asks. Prose (department descriptions,
    services, FAQ articles) is authored here and copied into the agent's
    search index by a sync job that polls `updated_since` (see "Sync").

    ## What changed in 1.2.0

    - NEW `Holidays` — hospital-wide closures. Availability returns a
      `holiday` status and booking refuses the date with `409 HOLIDAY`.
    - NEW `visit_type` on appointments (`new`, `follow_up`,
      `report_showing`) and an optional separate report-showing queue per
      session (`report_capacity`).
    - NEW `POST /schedules/import` — upload the OPD room-allocation
      spreadsheet (or CSV), preview the result, then apply it.
    - NEW `GET /audit-log` — who changed what, when, with before/after.
    - NEW `Hospital` profile — address, hotlines, emails, OPD and desk
      hours (replaces the voice agent's `CRM_OPENING_HOURS` setting).
    - NEW `Packages`, `Services` (including facility rooms) and `Articles`
      (FAQ and general content).
    - CHANGED `Department` — adds `description_bn` and `conditions`.
    - NEW sync convention: `updated_since` and `include_deleted` on every
      content list; content deletes are soft (`deleted_at`).
    - NEW (optional) `Queue` — the serial currently being seen.

    ## What changed in 1.1.0

    1.1.0 moves doctor schedules, rooms and departments out of the voice
    agent's knowledge base (the OPD room-allocation spreadsheet) and into this
    API, so a schedule edited here is what callers hear on the very next call.

    - NEW `Departments` resource; doctors reference one by `department_id`.
    - NEW `DoctorSchedule` (weekly OPD sessions with room, floor, desk, capacity).
    - NEW `ScheduleException` (leave, cancelled sessions, extra sessions).
    - NEW computed availability: `GET /doctors/{doctor_id}/availability` and
      `GET /availability`.
    - CHANGED `Doctor`: adds `department_id`, `name_bn`, `is_active`,
      `accepting_appointments`, `consultation_fee`; new list filters.
    - CHANGED `Appointment`: the server assigns `serial_number` and the time,
      validates the booking against the schedule, and rejects past dates,
      days with no session, full sessions and duplicate bookings with a
      machine-readable `code` (see `ErrorResponse`).
    - CHANGED `POST /patients` and `POST /appointments` accept an
      `Idempotency-Key` header.
    - CHANGED `GET /patients` adds an exact `mobile_number` filter.

    Every 1.0.0 request stays valid. `AppointmentCreate.appointment_time` is
    now optional (the server derives it), which loosens rather than breaks
    the contract.

    ## Time zone

    All `date` and `time` values are hospital-local (Asia/Dhaka) and carry no
    offset. "Today" and "past date" are judged by the Asia/Dhaka calendar.
    `date-time` values (`created_at`, `updated_at`) are ISO 8601 with offset.

    ## API key scopes

    Keys are issued per user by `POST /auth/login` and sent as `X-API-Key`.
    Each key has a scope:

    - `admin` — full read/write on every resource.
    - `agent` — the voice agent. Read on everything except `/audit-log`;
      write ONLY on patients and appointments. Any other write returns
      `403 FORBIDDEN_SCOPE`. For this scope:
      - staff-private fields (`Doctor.mobile_number`, `Doctor.email`,
        `ScheduleException.note`, `Holiday.note`) are OMITTED from responses;
      - unpublished or inactive content (`Article.is_published = false`,
        `is_active = false` packages/services/departments) is not returned
        unless `include_deleted=true` is passed for sync.
      Anything the agent receives it may read aloud to any caller.

    ## Sync

    Content the agent searches in free text — departments, doctors,
    packages, services, articles, the hospital profile — supports:

    - `updated_since=<date-time>`: only records whose `updated_at` (or
      `deleted_at`) is after that instant. `updated_at` MUST be set on every
      write, including create.
    - `include_deleted=true`: also return soft-deleted, unpublished and
      inactive records, so the sync job can remove them from its index.

    `DELETE` on these resources is soft: it sets `deleted_at` and hides the
    record from normal lists. The response header `X-Server-Time` on every
    list gives the instant to pass as the next `updated_since`.

    ## Errors

    Validation failures keep FastAPI's `422 HTTPValidationError`. Business-rule
    failures return `409` (or `404`/`403`) with an `ErrorResponse` body whose
    `code` a client can branch on without parsing `detail`.
servers:
  - url: http://103.141.67.150
    description: Current instance (plain HTTP — TLS strongly recommended)
security:
  - APIKeyHeader: []
tags:
  - name: Auth
  - name: Patients
  - name: Departments
    description: NEW in 1.1.0
  - name: Doctors
  - name: Schedules
    description: NEW in 1.1.0 — weekly OPD sessions and exceptions
  - name: Availability
    description: NEW in 1.1.0 — computed, read-only
  - name: Holidays
    description: NEW in 1.2.0 — hospital-wide closures
  - name: Appointments
  - name: Imports
    description: NEW in 1.2.0 — upload the OPD room-allocation spreadsheet
  - name: Audit
    description: NEW in 1.2.0 — change history (admin only)
  - name: Hospital
    description: NEW in 1.2.0 — address, contacts, hours
  - name: Packages
    description: NEW in 1.2.0 — health check-up packages
  - name: Services
    description: NEW in 1.2.0 — services and facility rooms
  - name: Articles
    description: NEW in 1.2.0 — FAQ and general content
  - name: Queue
    description: NEW in 1.2.0, OPTIONAL — the serial currently being seen
  - name: Health

paths:
  # ── Auth (unchanged) ─────────────────────────────────────────────────────
  /auth/login:
    post:
      tags: [Auth]
      summary: Login
      operationId: login_auth_login_post
      security: []
      description: |
        Simple login — no registration endpoint exists.
        Users are created only via the seed script (app/seed.py).

        Returns the user's persistent API key. Send it back on every other
        request as the `X-API-Key` header (not an Authorization/Bearer token).
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: { $ref: '#/components/schemas/Body_login_auth_login_post' }
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiKeyResponse' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ── Patients ─────────────────────────────────────────────────────────────
  /patients:
    post:
      tags: [Patients]
      summary: Create Patient
      operationId: create_patient_patients_post
      description: |
        CHANGED in 1.1.0: accepts `Idempotency-Key`. A repeated request with
        the same key returns the original `201` body instead of creating a
        second patient.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PatientCreate' }
      responses:
        '201':
          description: Created (or the original result of a repeated Idempotency-Key)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PatientOut' }
        '409':
          description: |
            `IDEMPOTENCY_KEY_REUSED` — the key was already used with a
            different request body.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422': { $ref: '#/components/responses/ValidationError' }
    get:
      tags: [Patients]
      summary: List Patients
      operationId: list_patients_patients_get
      parameters:
        - $ref: '#/components/parameters/Skip'
        - $ref: '#/components/parameters/Limit'
        - name: search
          in: query
          required: false
          schema: { type: [string, 'null'] }
          description: Substring match on name or mobile number.
        - name: mobile_number
          in: query
          required: false
          schema: { type: [string, 'null'], maxLength: 20 }
          description: |
            NEW in 1.1.0. EXACT match after normalising both sides to the
            11-digit national form: strip everything but digits, drop a
            leading `88`, so `+8801712345678`, `8801712345678`,
            `01712-345678` and `01712345678` all match the same patient.
            Wildcards are not interpreted.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PatientOut' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /patients/{patient_id}:
    parameters:
      - name: patient_id
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [Patients]
      summary: Get Patient
      operationId: get_patient_patients__patient_id__get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PatientOut' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    put:
      tags: [Patients]
      summary: Update Patient
      operationId: update_patient_patients__patient_id__put
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PatientUpdate' }
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PatientOut' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Patients]
      summary: Delete Patient
      operationId: delete_patient_patients__patient_id__delete
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ── Departments (NEW) ────────────────────────────────────────────────────
  /departments:
    get:
      tags: [Departments]
      summary: List Departments
      operationId: list_departments_departments_get
      parameters:
        - $ref: '#/components/parameters/Skip'
        - $ref: '#/components/parameters/Limit'
        - name: search
          in: query
          required: false
          schema: { type: [string, 'null'] }
          description: |
            Case-insensitive match against `name`, `name_bn` and every entry
            of `aliases`, by word prefix (so `ent` matches "ENT, Head & Neck
            Surgery" but not "Gastroenterology").
        - name: service_line
          in: query
          required: false
          schema:
            anyOf:
              - $ref: '#/components/schemas/ServiceLine'
              - type: 'null'
        - name: is_active
          in: query
          required: false
          schema: { type: [boolean, 'null'], default: true }
        - $ref: '#/components/parameters/UpdatedSince'
        - $ref: '#/components/parameters/IncludeDeleted'
      responses:
        '200':
          description: Successful Response
          headers:
            X-Server-Time: { $ref: '#/components/headers/XServerTime' }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DepartmentOut' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Departments]
      summary: Create Department
      operationId: create_department_departments_post
      description: Requires `admin` scope.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DepartmentCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DepartmentOut' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: '`DUPLICATE_NAME`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /departments/{department_id}:
    parameters:
      - name: department_id
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [Departments]
      summary: Get Department
      operationId: get_department_departments__department_id__get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DepartmentOut' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Departments]
      summary: Update Department
      operationId: update_department_departments__department_id__put
      description: Requires `admin` scope.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DepartmentUpdate' }
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DepartmentOut' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Departments]
      summary: Delete Department
      operationId: delete_department_departments__department_id__delete
      description: |
        Requires `admin` scope. Refused with `409 HAS_DOCTORS` while any doctor
        references it — set `is_active: false` instead. CHANGED in 1.2.0:
        soft delete (sets `deleted_at`).
      responses:
        '204': { description: Deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`HAS_DOCTORS`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  # ── Doctors ──────────────────────────────────────────────────────────────
  /doctors:
    post:
      tags: [Doctors]
      summary: Create Doctor
      operationId: create_doctor_doctors_post
      description: Requires `admin` scope.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DoctorCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DoctorOut' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
    get:
      tags: [Doctors]
      summary: List Doctors
      operationId: list_doctors_doctors_get
      description: |
        CHANGED in 1.1.0: new filters `department_id`, `is_active`,
        `available_on`; `search` also matches `name_bn`.
      parameters:
        - $ref: '#/components/parameters/Skip'
        - $ref: '#/components/parameters/Limit'
        - name: specialization
          in: query
          required: false
          schema: { type: [string, 'null'] }
          description: Substring match on the display `specialization`. Prefer `department_id`.
        - name: search
          in: query
          required: false
          schema: { type: [string, 'null'] }
          description: Substring match on `name` and `name_bn`. `%` and `_` are matched literally.
        - name: department_id
          in: query
          required: false
          schema: { type: [integer, 'null'] }
          description: NEW in 1.1.0.
        - name: is_active
          in: query
          required: false
          schema: { type: [boolean, 'null'], default: true }
          description: NEW in 1.1.0. Pass `null`/omit explicitly to include inactive doctors (admin views).
        - name: available_on
          in: query
          required: false
          schema: { type: [string, 'null'], format: date }
          description: |
            NEW in 1.1.0. Only doctors with at least one session on that date
            after applying exceptions and holidays (status `available` or
            `full` in availability terms).
        - $ref: '#/components/parameters/UpdatedSince'
        - $ref: '#/components/parameters/IncludeDeleted'
      responses:
        '200':
          description: Successful Response
          headers:
            X-Server-Time: { $ref: '#/components/headers/XServerTime' }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DoctorOut' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /doctors/{doctor_id}:
    parameters:
      - $ref: '#/components/parameters/DoctorId'
    get:
      tags: [Doctors]
      summary: Get Doctor
      operationId: get_doctor_doctors__doctor_id__get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DoctorOut' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    put:
      tags: [Doctors]
      summary: Update Doctor
      operationId: update_doctor_doctors__doctor_id__put
      description: Requires `admin` scope.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DoctorUpdate' }
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DoctorOut' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Doctors]
      summary: Delete Doctor
      operationId: delete_doctor_doctors__doctor_id__delete
      description: |
        Requires `admin` scope. CHANGED in 1.1.0: refused with
        `409 HAS_FUTURE_APPOINTMENTS` while the doctor has scheduled
        appointments from today onward — set `is_active: false` instead.
        CHANGED in 1.2.0: soft delete (sets `deleted_at`), so past
        appointments keep their doctor.
      responses:
        '204': { description: Deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`HAS_FUTURE_APPOINTMENTS`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  # ── Schedules (NEW) ──────────────────────────────────────────────────────
  /doctors/{doctor_id}/schedules:
    parameters:
      - $ref: '#/components/parameters/DoctorId'
    get:
      tags: [Schedules]
      summary: List Doctor Schedules
      operationId: list_doctor_schedules
      description: |
        The doctor's weekly OPD sessions. A weekday with no row means NO
        SESSION that day — there is no "unknown" state.
      parameters:
        - name: effective_on
          in: query
          required: false
          schema: { type: [string, 'null'], format: date }
          description: |
            Only rows valid on this date (`valid_from <= date` and
            (`valid_to` is null or `valid_to >= date`)). Omit for all rows,
            past and future.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ScheduleOut' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Schedules]
      summary: Create Doctor Schedule
      operationId: create_doctor_schedule
      description: |
        Requires `admin` scope. Refused with `409 SCHEDULE_OVERLAP` if it
        overlaps another session of the same doctor on the same weekday
        within an overlapping validity range, and `409 ROOM_CONFLICT` if the
        room/desk is already allocated to another doctor for an overlapping
        time on that weekday.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScheduleCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScheduleOut' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`SCHEDULE_OVERLAP` or `ROOM_CONFLICT`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /schedules/{schedule_id}:
    parameters:
      - $ref: '#/components/parameters/ScheduleId'
    get:
      tags: [Schedules]
      summary: Get Schedule
      operationId: get_schedule
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScheduleOut' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Schedules]
      summary: Update Schedule
      operationId: update_schedule
      description: |
        Requires `admin` scope. Takes effect immediately for every future
        date the row covers. To change a rota from a future date, end-date
        this row (`valid_to`) and create a new one with `valid_from` instead.

        Existing appointments are NEVER moved or cancelled by this call. Any
        scheduled appointment from today onward that no longer falls inside
        a session is returned in `affected_appointments` so staff can
        contact those patients.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScheduleUpdate' }
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScheduleChangeResult' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`SCHEDULE_OVERLAP` or `ROOM_CONFLICT`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Schedules]
      summary: Delete Schedule
      operationId: delete_schedule
      description: |
        Requires `admin` scope. Refused with `409 HAS_FUTURE_APPOINTMENTS`
        while scheduled appointments from today onward are booked into this
        session. To retire a session, set `valid_to` instead.
      responses:
        '204': { description: Deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`HAS_FUTURE_APPOINTMENTS`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /doctors/{doctor_id}/exceptions:
    parameters:
      - $ref: '#/components/parameters/DoctorId'
    get:
      tags: [Schedules]
      summary: List Schedule Exceptions
      operationId: list_schedule_exceptions
      parameters:
        - name: date_from
          in: query
          required: false
          schema: { type: [string, 'null'], format: date }
          description: Defaults to today.
        - name: date_to
          in: query
          required: false
          schema: { type: [string, 'null'], format: date }
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ScheduleExceptionOut' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Schedules]
      summary: Create Schedule Exception
      operationId: create_schedule_exception
      description: |
        Requires `admin` scope. Leave, a cancelled session, or an extra
        one-off session on a single date. Takes effect immediately.

        As with schedule updates, existing appointments are NOT cancelled:
        those on the date that no longer fall inside a session are returned
        in `affected_appointments`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScheduleExceptionCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScheduleExceptionResult' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`SCHEDULE_OVERLAP` or `ROOM_CONFLICT` (extra_session only)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /exceptions/{exception_id}:
    parameters:
      - name: exception_id
        in: path
        required: true
        schema: { type: integer }
    delete:
      tags: [Schedules]
      summary: Delete Schedule Exception
      operationId: delete_schedule_exception
      description: |
        Requires `admin` scope. Refused with `409 HAS_FUTURE_APPOINTMENTS`
        for an `extra_session` that has bookings.
      responses:
        '204': { description: Deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`HAS_FUTURE_APPOINTMENTS`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  # ── Availability (NEW, computed) ─────────────────────────────────────────
  /doctors/{doctor_id}/availability:
    parameters:
      - $ref: '#/components/parameters/DoctorId'
    get:
      tags: [Availability]
      summary: Doctor Availability
      operationId: get_doctor_availability
      description: |
        Weekly schedule, minus holidays, minus exceptions, minus bookings, per
        date. This is the endpoint the voice agent calls; it must never be
        cached for longer than a few seconds so a schedule change is heard on
        the next call.

        One entry per date in the range, including dates with no session.
      parameters:
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DoctorAvailability' }
              example:
                doctor_id: 12
                doctor_name: Prof. Dr. Khwaja Nazim Uddin
                days:
                  - date: '2026-09-27'
                    weekday: sunday
                    status: available
                    sessions:
                      - schedule_id: 40
                        start_time: '09:00'
                        end_time: '17:00'
                        room: '3042'
                        floor: 3rd
                        desk: A
                        capacity: 30
                        booked: 12
                        remaining: 18
                        next_serial: 13
                        report_capacity: 10
                        report_booked: 2
                        report_remaining: 8
                        now_serving: null
                  - date: '2026-09-28'
                    weekday: monday
                    status: leave
                    sessions: []
                  - date: '2026-09-30'
                    weekday: wednesday
                    status: holiday
                    holiday_name: Durga Puja
                    sessions: []
                  - date: '2026-10-02'
                    weekday: friday
                    status: no_session
                    sessions: []
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

