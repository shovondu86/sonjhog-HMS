# /etc/nginx/sites-available/hospital-api
# Reverse proxy to the app running on 127.0.0.1:8000 (uvicorn/gunicorn).
# Symlink into sites-enabled and reload nginx to activate:
#   sudo ln -s /etc/nginx/sites-available/hospital-api /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

upstream hospital_api {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    server_name api.yourdomain.com;   # <-- change this

    client_max_body_size 10M;

    access_log /var/log/nginx/hospital-api.access.log;
    error_log  /var/log/nginx/hospital-api.error.log;

    location / {
        proxy_pass http://hospital_api;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep-alive / websocket upgrade support (harmless if unused)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

# --- After testing on plain HTTP, get a free cert and force HTTPS: ---
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d api.yourdomain.com
# certbot will rewrite this file to add a 443 server block + auto HTTP->HTTPS redirect.
